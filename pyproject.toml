[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "se2cad"
version = "0.0.0"
description = "Convert Space Engineers blueprints into engineering CAD assemblies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"se2cad.catalog" = ["*.json"]
